version: '3.4'
services:
  tb-gateway:
    image: thingsboard/tb-gateway:${var.gatewayVersion}
    container_name: tb-gateway
    restart: always

    ports:
        - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - host=host.docker.internal
      - port=1883
      - accessToken=PUT_YOUR_ACCESS_TOKEN

    volumes:
      - tb-gw-config:/thingsboard_gateway/config
      - tb-gw-logs:/thingsboard_gateway/logs
      - tb-gw-extensions:/thingsboard_gateway/extensions
volumes:
  tb-gw-config:
    name: tb-gw-config
  tb-gw-logs:
    name: tb-gw-logs
  tb-gw-extensions:
    name: tb-gw-extensions
